site_name: litmus
site_url: https://gitlab.com/Tyler-Meador/litmus_test/-/tree/main/docs/
site_description: React-for-hardware HIL testing framework
repo_url: https://gitlab.com/Tyler-Meador/litmus_test
edit_uri: -/blob/main/docs/
copyright: Copyright 2026 Tyler Meador

strict: true
docs_dir: docs
site_dir: site
# Nothing hosts the site (#138). A release branch commits the build under
# docs/site/, opened from a clone as file://, so links end in .html rather than
# in a directory the filesystem cannot resolve; and that committed build must not
# be swept into the next one.
use_directory_urls: false
exclude_docs: |
  site/

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Floor Technician: floor-technician.md
  - Overview: overview.md
  - Idioms: idioms.md
  - Contracts: contracts.md
  - Utilities: utilities.md
  - Inspector JSON: inspector-json.md
  - Inspector (target specification): inspector.md
  - Measurements: measurements.md
  - JUnit XML: junit-xml.md
  - litmus run: litmus-run.md
  - litmus new: litmus-new.md
  - litmus-check: litmus-check.md
  - API stability: api-stability.md
  - API reference: api.md
  - HIL interfaces:
      - Overview: hil/index.md
      - GPIO (design note): hil/gpio.md
      - PWM (design note): hil/pwm.md
      - CAN bus (design note): hil/can.md
      - I2C/SPI (design note): hil/i2c-spi.md
      - Device API (design note): hil/device-api.md
      - Serial/UART (design note): hil/serial.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
