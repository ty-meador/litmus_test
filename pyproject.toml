[project]
name = "litmus"
version = "0.0.1"
description = "React-for-hardware HIL testing framework — Python port"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "asyncssh>=2.21",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
pylsp = [
    "python-lsp-server>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "pytest-cov>=7",
    "pip-audit>=2.10",
    "hypothesis>=6.151",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
    "mutmut>=3.7.0",
    "python-lsp-server>=1.12",
]

[project.scripts]
litmus = "litmus.cli:main"
litmus-check = "litmus_check.cli:main"

[project.entry-points.pylsp]
litmus_check = "litmus_check.pylsp_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litmus", "tools/litmus_check"]

# The Inspector validates against the published contract, including outside a checkout.
[tool.hatch.build.targets.wheel.force-include]
"docs/schema/timeline-v1.schema.json" = "litmus_data/timeline-v1.schema.json"
"docs/schema/artifact-v1.schema.json" = "litmus_data/artifact-v1.schema.json"
"docs/schema/result-v1.schema.json" = "litmus_data/result-v1.schema.json"

# ---------------------------------------------------------------------------
# Tooling — single source of truth. Run via `make`; do not override locally.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming — standard PEP 8 naming
    "UP",        # pyupgrade — enforce latest-3.x idioms
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return discipline
    "RUF",       # ruff-native
    "ASYNC",     # async pitfalls (blocking calls in async code)
    "PTH",       # pathlib over os.path
    "ANN",       # type annotations required on all defs (STANDARDS.md §2)
    "PT",        # pytest style
]
ignore = [
    "ANN401",    # explicit Any is allowed where the contract is dict[str, Any] (ctx)
]

[tool.ruff.lint.per-file-ignores]
# The failure taxonomy's class names are fixed by PLAN.md section 2 and carried from
# the legacy framework — they are the vocabulary the FT and the artifacts already use.
# An `Error` suffix would rename a published contract to satisfy a naming convention.
"src/litmus/errors.py" = ["N818"]

[tool.pyright]
include = ["src", "tests", "examples", "tools"]
extraPaths = ["tools"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["litmus", "litmus_check"]
# The report stays out of the checkout's tracked tree and clear of the evidence
# containment guard, which watches ``artifacts/`` only.
data_file = ".coverage/data"

[tool.coverage.report]
precision = 1
# Global floor. Ratchet-only: raise it to the new measurement when coverage rises,
# never lower it (STANDARDS.md section 6). Per-file floors: [tool.litmus.coverage].
fail_under = 97.1
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.json]
output = ".coverage/coverage.json"

[tool.coverage.xml]
output = ".coverage/cobertura.xml"

[tool.litmus.coverage]
# Per-file branch-coverage floors on the kernel of trust, enforced by
# tools/coverage_floor.py after the suite runs. Ratchet-only, like fail_under.
[tool.litmus.coverage.floors]
"src/litmus/verdict.py" = 100.0
"src/litmus/base.py" = 94.5
"src/litmus/lifecycle.py" = 98.8
"src/litmus/executor.py" = 92.8
"src/litmus/timeline.py" = 100.0

[tool.pytest.ini_options]
addopts = "--hypothesis-seed=64"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mutmut]
# Mutation audit over the kernel of trust (issue #69). `make mutants`, not a gate.
# The whole package is copied so imports resolve; only these three files are mutated.
source_paths = ["src/litmus"]
only_mutate = ["src/litmus/verdict.py", "src/litmus/base.py", "src/litmus/lifecycle.py"]
# Scoped to the test files that actually cover the three modules (verified via
# coverage contexts), so a mutant's rerun stays cheap under the 90-minute audit budget.
pytest_add_cli_args_test_selection = [
    "tests/test_verdict.py",
    "tests/test_base.py",
    "tests/test_lifecycle.py",
    "tests/test_evidence_on_verdict.py",
    "tests/test_abort_phase_matrix.py",
    "tests/test_author_error_messages.py",
    "tests/test_time_budget.py",
    "tests/test_composition.py",
    "tests/test_context_sufficiency.py",
    "tests/test_hooks.py",
    "tests/test_operator_interrupt.py",
    "tests/test_rack_scale.py",
    "tests/test_results.py",
    "tests/test_structural_contracts.py",
    "tests/test_via.py",
    "tests/test_artifacts.py",
    "tests/test_junit.py",
    "tests/test_run_data.py",
    "tests/test_lifecycle_engine.py",
    "tests/test_in_flight_termination.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
