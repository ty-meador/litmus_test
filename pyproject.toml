[project]
name = "litmus"
version = "0.0.1"
description = "React-for-hardware HIL testing framework — Python port"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncssh>=2.21",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litmus"]

# ---------------------------------------------------------------------------
# Tooling — single source of truth. Run via `make`; do not override locally.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade — enforce latest-3.x idioms
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return discipline
    "RUF",       # ruff-native
    "ASYNC",     # async pitfalls (blocking calls in async code)
    "PTH",       # pathlib over os.path
    "ANN",       # type annotations required on all defs (STANDARDS.md §2)
    "PT",        # pytest style
]
ignore = [
    "ANN401",    # explicit Any is allowed where the contract is dict[str, Any] (ctx)
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
