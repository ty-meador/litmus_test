# There is no CI gate (Ty's ruling of 2026-09-10, recorded on #104): `make check`
# at the bench before every merge is the gate, permanently; the reviewer runs it
# again before merging, and nothing arms auto-merge on a pipeline. The gate jobs
# and the nightly-soak and dependency-update schedules that once lived here are
# gone (#138). What remains is the one job that has no bench equivalent: a version
# tag rebuilding the docs site into `public/` for Pages. Whether that job stays
# or the site moves to a host with a bench publish step is ruled on #138.

workflow:
  rules:
    - if: $CI_COMMIT_TAG

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  interruptible: true
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

# Version tags publish the docs site. `make docs` already ran in the bench gate on
# the MR that produced the tag; this job rebuilds into `public/` for Pages.
pages:
  extends: .uv-job
  stage: deploy
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv sync --locked
    - make docs
    - mv site public
  artifacts:
    paths:
      - public
