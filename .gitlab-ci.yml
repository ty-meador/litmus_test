# CI gate — mirrors `make check` exactly: verify only, no auto-fix. A red
# pipeline means the change does not merge; there is no passing a subset.
#
# The image carries uv on a Debian base with make and Python 3.14 preinstalled,
# matching .python-version. `uv sync --locked` refuses a stale uv.lock rather
# than silently re-resolving, so lockfile drift fails here, loudly, before the
# gate runs.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Gate jobs run on MRs and main; a schedule selects its own job by SCHEDULED_JOB.
.gate-job:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  interruptible: true
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

check:
  extends: [.uv-job, .gate-job]
  script:
    - uv sync --locked
    - make check
  # The coverage summary is read off the TOTAL line and the Cobertura report feeds
  # the MR diff view; both come from the gate's own run, nothing is re-measured.
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - .coverage/coverage.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: .coverage/cobertura.xml

# Timing races don't lose the same way twice: a suite that passes once can fail
# 7 of 8 on another machine (!42). Eight runs is a second net, not proof.
soak:
  extends: [.uv-job, .gate-job]
  script:
    - uv sync --locked
    - make soak

# Weekly (schedule: SCHEDULED_JOB=dependency-update). Refreshes uv.lock and opens an MR
# carrying the upgrade plan; that MR's pipeline runs the gate, audit included, over the
# new set. Needs LITMUS_BOT_TOKEN (api + write_repository) as a masked CI variable.
dependency-update:
  extends: .uv-job
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "dependency-update"
  script:
    - uv sync --locked
    - uv run python tools/dependency_update.py

# Nightly (schedule: SCHEDULED_JOB=nightly-soak). The full suite SOAK_RUNS times and the
# rack suite RACK_REPEATS times on the main head (#68). The night is recorded on issue
# #68 through LITMUS_BOT_TOKEN, and a red night reaches #general through
# DISCORD_WEBHOOK_URL (masked CI variable). The schedule's own variables override the
# defaults below. The Phase 6 exit counts fourteen consecutive green nights on the issue.
nightly-soak:
  extends: .uv-job
  interruptible: false
  timeout: 2h
  variables:
    SOAK_RUNS: "8"
    RACK_REPEATS: "20"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "nightly-soak"
  script:
    - uv sync --locked
    - uv run python tools/nightly_soak.py
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - .soak/
